<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Майстерня молодіжної роботи — онлайн-демо гри</title>
<meta name="description" content="Спробуйте карткову гру «Майстерня молодіжної роботи» онлайн: вільний стіл, режим для тренінгу, базова гра й «Вгадай слово».">
<meta property="og:type" content="website">
<meta property="og:title" content="Майстерня молодіжної роботи — спробуйте гру онлайн">
<meta property="og:description" content="Витягніть картки, зіграйте раунд базової гри чи «Вгадай слово» просто в браузері.">
<meta property="og:image" content="https://demo.maisternia-youth-work.com.ua/og.jpg">
<meta property="og:url" content="https://demo.maisternia-youth-work.com.ua/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#5F8034">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<style>
/* Layout: full-screen soft cloth with even light; world plane (cards, decks, box) fits the screen and can be zoomed/panned; logo + modes float top-left, help sits bottom-left with its "?", tools bottom-right. Single deliberate look. */
:root{
  --felt:#5F8034;
  --card:#DEF2C5;
  --ink:#476136;
  --green:#51643C;
  --deep:#40542D;
  --light:#E5F1D4;
  --offwhite:#F6FAF1;
  --text:#1d2814;
  --shadow:14,24,6;
  --f-text:"Fixel Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-display:"Fixel Display","Fixel Text",system-ui,-apple-system,Arial,sans-serif;
  color-scheme:light;
}
@font-face{font-family:"Fixel Text";src:url(fonts/FixelText-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Fixel Text";src:url(fonts/FixelText-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Fixel Text";src:url(fonts/FixelText-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Fixel Text";src:url(fonts/FixelText-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Fixel Display";src:url(fonts/FixelDisplay-SemiBold.woff2) format("woff2");font-weight:600;font-display:swap}

[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--felt);color:var(--ink);font-family:var(--f-text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;flex-shrink:0}

/* ---------- table ---------- */
#viewport{position:fixed;inset:0;z-index:0;overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--felt);background-image:url(img/fur.png);background-blend-mode:soft-light;background-size:384px}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;perspective:2600px}

/* ---------- cards ---------- */
.card{position:absolute;left:0;top:0;width:200px;height:283px;transform-origin:50% 50%;will-change:transform;perspective:900px;cursor:pointer;outline:none}
.sh{position:absolute;inset:0;border-radius:11px;background:rgba(var(--shadow),.62);pointer-events:none}
.sh-soft{filter:blur(9px)}
.sh-contact{filter:blur(1.2px);transform:translate(1px,1.5px)}
.flip{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);container-type:inline-size}
.face img{width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.face::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 .6px rgba(255,255,255,.35)}
.back{transform:rotateY(180deg)}
.custom{position:absolute;left:9%;right:9%;top:23%;height:34%;overflow:hidden;font:500 6.6cqw/1.32 var(--f-text);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.custom:empty{display:none}
.badge{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);display:none;align-items:center;gap:6px;background:var(--light);color:var(--ink);font:600 13px/1 var(--f-text);letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border-radius:99px;white-space:nowrap;box-shadow:0 6px 14px rgba(var(--shadow),.35)}
.card.chosen .badge{display:flex}
.card.chosen .sh-soft{background:rgba(229,241,212,.9);filter:blur(14px)}
#world.has-chosen .card.ring:not(.chosen) .face img{filter:brightness(.82) saturate(.75)}
.card:focus-visible .face.front{box-shadow:0 0 0 4px var(--offwhite)}

/* ---------- decks, slots, labels ---------- */
.deck{position:absolute;left:0;top:0;width:200px;height:283px;border-radius:10px;cursor:pointer;transition:transform .7s cubic-bezier(.3,.7,.2,1);outline:none}
.deck .stack{position:absolute;inset:0;border-radius:10px;background:var(--card)}
.deck .stack img{width:100%;height:100%;border-radius:10px;display:block;pointer-events:none}
.deck.empty .stack{background:transparent;box-shadow:none!important;border:2px dashed rgba(229,241,212,.55)}
.deck.empty .stack img{display:none}
.deck .label,.wlabel{font:600 15px/1.15 var(--f-text);letter-spacing:.12em;text-transform:uppercase;color:var(--light);pointer-events:none;white-space:nowrap;text-align:center}
.deck .label{position:absolute;left:0;width:200px;top:300px}
.deck .label b,.wlabel b{font-weight:500;opacity:.72}
.deck:focus-visible .stack{outline:4px solid var(--offwhite);outline-offset:4px}
.deck.pulse::before{content:"";position:absolute;inset:-6px;border-radius:16px;border:3px solid var(--light);animation:pulse 1.8s ease-out infinite;pointer-events:none}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.14)}}
.slot{position:absolute;left:0;top:0;width:200px;height:283px;border-radius:10px;border:2px dashed rgba(229,241,212,.35);pointer-events:none;transition:opacity .4s, transform .7s cubic-bezier(.3,.7,.2,1);display:flex;align-items:center;justify-content:center;
  font:600 14px/1.2 var(--f-text);letter-spacing:.12em;text-transform:uppercase;color:rgba(229,241,212,.6);text-align:center}
.slot.off{opacity:0}
.wlabel{position:absolute;left:0;top:0;width:260px;transform-origin:50% 0;transition:transform .7s cubic-bezier(.3,.7,.2,1),opacity .3s}
.wlabel .tag{display:inline-block;margin-top:6px;padding:5px 9px;border-radius:99px;background:var(--light);color:var(--ink);font-size:12px;letter-spacing:.1em}
.wlabel.on{color:var(--offwhite)}
.wlabel.dim{opacity:.55}
#world.game .wlabel{font-size:19px}
#world.game .wlabel .tag{font-size:13px}
#world.port .deck .label,#world.port .wlabel{font-size:27px}
#world.port.game .wlabel{font-size:30px}
#world.port .wlabel .tag{font-size:22px;padding:8px 14px}
.wtimer{position:absolute;left:0;top:0;width:150px;height:150px;transition:opacity .3s}
.wtimer svg{width:100%;height:100%;transform:rotate(-90deg)}
.wtimer circle{fill:none;stroke-width:10}
.wtimer .bgc{stroke:rgba(229,241,212,.22);fill:rgba(20,34,10,.25)}
.wtimer .fg{stroke:var(--light);stroke-linecap:round;transition:stroke .3s}
.wtimer.low .fg{stroke:#F6FAF1}
.wtimer span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 50px/1 var(--f-display);color:var(--light);font-variant-numeric:tabular-nums}

/* ---------- box (folded from the real dieline) ---------- */
.boxcam{position:absolute;left:0;top:0;width:0;height:0;perspective:1800px;transition:perspective-origin .8s}
#box{position:absolute;left:0;top:0;width:333px;height:476px;transform-style:preserve-3d;cursor:pointer;outline:none;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
#box .bshadow{position:absolute;left:-71px;top:71px;width:476px;height:333px;border-radius:14px;background:rgba(var(--shadow),.6);filter:blur(22px);transform:translate(30px,46px);pointer-events:none}
#box .bshadow.c{filter:blur(4px);transform:translate(6px,8px);background:rgba(var(--shadow),.55)}
#box .b3d{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateZ(90deg)}
#box .lid{position:absolute;inset:0;transform-style:preserve-3d}
#box .f{position:absolute;background-size:100% 100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#box .f::after{content:"";position:absolute;inset:0;background:rgba(10,20,4,var(--dk,0))}
#box .top{left:0;top:0;width:333px;height:476px;background-image:url(img/box-top.webp);transform:translateZ(175px);border-radius:2px}
#box .top::after{background:linear-gradient(115deg,rgba(255,255,255,.12),rgba(255,255,255,0) 50%)}
#box .up{left:0;top:-175px;width:333px;height:175px;background-image:url(img/box-up.webp);transform-origin:50% 100%;transform:translateZ(175px) rotateX(90deg);--dk:.30}
#box .down{left:0;top:476px;width:333px;height:175px;background-image:url(img/box-down.webp);transform-origin:50% 0;transform:translateZ(175px) rotateX(-90deg);--dk:.06}
#box .left{left:-175px;top:0;width:175px;height:476px;background-image:url(img/box-left.webp);transform-origin:100% 50%;transform:translateZ(175px) rotateY(-90deg);--dk:.04}
#box .right{left:333px;top:0;width:175px;height:476px;background-image:url(img/box-right.webp);transform-origin:0 50%;transform:translateZ(175px) rotateY(90deg);--dk:.24}
#box .core{left:2px;top:2px;width:329px;height:472px;background:#CFE3B6;transform:translateZ(173px)}
/* only the lid lifts (as in v1): the table shadow shows in the gap under it */
#box.bump .lid{animation:lidhop .9s cubic-bezier(.3,.7,.3,1)}
@keyframes lidhop{0%{transform:translateZ(0)}22%{transform:translateZ(16px) rotateZ(-.6deg)}45%{transform:translateZ(0)}62%{transform:translateZ(6px) rotateZ(.3deg)}80%,100%{transform:translateZ(0)}}
#box:focus-visible .top{outline:4px solid var(--offwhite);outline-offset:6px}

/* ---------- buttons ---------- */
.tile{background:var(--light);border-radius:20px;box-shadow:0 14px 40px rgba(var(--shadow),.32),0 2px 6px rgba(var(--shadow),.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border:2px solid var(--green);background:transparent;color:var(--green);border-radius:0;
  font:500 13px/1 var(--f-text);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:rgba(81,100,60,.1)}
.btn.fill,.btn[aria-pressed="true"]{background:var(--green);color:var(--light)}
.btn.fill:hover{background:var(--deep)}
.btn.icon{width:40px;padding:0}
.btn.plain{border-color:transparent}
.btn.plain[aria-pressed="true"]{border-color:var(--green)}
.btn.big{height:52px;padding:0 22px;font-size:14px}
.btn:disabled{opacity:.35;cursor:default;background:transparent}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border:0;background:var(--light);color:var(--green);border-radius:0;cursor:pointer;white-space:nowrap;text-decoration:none;
  font:600 13px/1 var(--f-text);letter-spacing:.1em;text-transform:uppercase;box-shadow:0 6px 18px rgba(var(--shadow),.32),0 1px 3px rgba(var(--shadow),.2)}
.cbtn:hover{background:var(--offwhite)}
.cbtn.dark,.cbtn[aria-pressed="true"]{background:var(--deep);color:var(--light)}
.cbtn.dark:hover,.cbtn[aria-pressed="true"]:hover{background:#4A6034}
.cbtn.icon{width:44px;padding:0}
.cbtn:focus-visible{outline:3px solid var(--offwhite);outline-offset:2px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border:2px solid var(--light);background:transparent;color:var(--light);border-radius:0;
  font:600 13px/1 var(--f-text);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;text-decoration:none}
.ibtn:hover{background:rgba(229,241,212,.14)}
.ibtn.fill{background:var(--light);color:var(--green)}
.ibtn:focus-visible,#logo:focus-visible{outline:3px solid var(--offwhite);outline-offset:3px}

/* ---------- header ---------- */
#top{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 18px);left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:28px;pointer-events:none}
#top>*{pointer-events:auto}
#logo{display:block;flex-shrink:0}
#logo img{display:block;height:42px;width:auto;filter:drop-shadow(0 4px 10px rgba(var(--shadow),.28))}
#modes{display:flex;box-shadow:0 8px 24px rgba(var(--shadow),.28)}
.mbtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border:0;background:var(--light);color:var(--green);cursor:pointer;font:600 13px/1 var(--f-text);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.mbtn+.mbtn{box-shadow:inset 1.5px 0 0 rgba(81,100,60,.16)}
.mbtn:hover{background:var(--offwhite)}
.mbtn[aria-pressed="true"]{background:var(--deep);color:var(--light)}
.mbtn:focus-visible{outline:3px solid var(--offwhite);outline-offset:2px;position:relative;z-index:1}
#modeDrop{position:relative;margin-left:auto;display:none}
#modeBtn{background:var(--light);border-color:var(--light);color:var(--green);box-shadow:0 8px 24px rgba(var(--shadow),.3)}
#modeBtn:hover{background:var(--offwhite)}
#modeBtn svg{width:16px;height:16px;transition:transform .2s}
#modeBtn[aria-expanded="true"] svg{transform:rotate(180deg)}
#modeMenu{position:absolute;right:0;top:calc(100% + 8px);min-width:240px;padding:8px;display:flex;flex-direction:column;border-radius:16px}
.mitem{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;padding:0 14px;border:0;background:transparent;color:var(--green);text-align:left;cursor:pointer;font:600 13px/1 var(--f-text);letter-spacing:.1em;text-transform:uppercase}
.mitem:hover{background:rgba(81,100,60,.1)}
.mitem[aria-current="true"]{background:var(--green);color:var(--light)}
.mitem .new{font:600 10px/1 var(--f-text);letter-spacing:.08em;padding:4px 6px;background:var(--light);color:var(--green);border:1px solid currentColor}
.mitem[aria-current="true"] .new{border-color:var(--light)}

/* ---------- help corner: "?" and the hint live together ---------- */
#help{position:fixed;z-index:20;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;align-items:flex-end;gap:10px}
#helpBtn{width:48px;height:48px;padding:0;flex-shrink:0}
#helpBtn svg{width:22px;height:22px}
#hint{max-width:380px;font:400 15.5px/1.4 var(--f-text);color:var(--text);padding:13px 18px;border-radius:16px;text-wrap:pretty}
#hint b{font-weight:600;color:var(--ink)}
#help.closed #hint,body.has-stage #hint{display:none}

/* ---------- toolbar ---------- */
#bar{position:fixed;z-index:20;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;align-items:center;justify-content:flex-end;gap:12px}
#bar .grp{display:flex;align-items:center;gap:8px}
#bar .zg{padding:6px;border-radius:14px;gap:2px}
#bar .lab{font:600 12px/1 var(--f-text);letter-spacing:.1em;text-transform:uppercase;color:var(--light);margin:0 2px 0 4px;text-shadow:0 1px 3px rgba(var(--shadow),.4)}
#bar .seg{display:flex;box-shadow:0 6px 18px rgba(var(--shadow),.32)}
#bar .seg .cbtn{width:44px;padding:0;box-shadow:none}
#bar .seg .cbtn+.cbtn{box-shadow:inset 1.5px 0 0 rgba(81,100,60,.16)}
#zpct{width:56px;padding:0;font:600 12px/1 var(--f-text);letter-spacing:.02em;font-variant-numeric:tabular-nums}

/* ---------- stage (game prompts) ---------- */
#stage{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:90px max(16px,env(safe-area-inset-right,0px)) 100px max(16px,env(safe-area-inset-left,0px));pointer-events:none}
#stage.dim{pointer-events:auto;background:rgba(18,30,8,.42)}
#stage.dock{align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
#stage.curtain{pointer-events:auto;background-color:#3F5A24;background-image:url(img/fur.png);background-blend-mode:soft-light;background-size:420px}
#stage .tile{pointer-events:auto;max-width:460px;width:100%;padding:28px;display:flex;flex-direction:column;gap:14px;animation:rise .4s cubic-bezier(.2,.8,.2,1)}
#stage.dock .tile{max-width:520px;padding:18px 20px;flex-direction:row;align-items:center;gap:16px}
#stage.dock .tile .txt{flex:1;min-width:0}
#stage h2{margin:0;font:600 28px/1.08 var(--f-display);letter-spacing:-.03em;color:var(--green);text-wrap:balance}
#stage p{margin:0;font:400 16.5px/1.45 var(--f-text);color:var(--text);text-wrap:pretty}
#stage .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#stage .row .k{font:500 12px/1 var(--f-text);letter-spacing:.1em;text-transform:uppercase;color:var(--green);min-width:120px}
#stage .seg{display:flex}
#stage .seg .btn{min-width:46px;padding:0 12px}
#stage .seg .btn+.btn{margin-left:-2px}
#stage .names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#stage input{height:42px;border:2px solid var(--green);border-radius:0;background:var(--offwhite);padding:0 12px;font:500 15px/1 var(--f-text);color:var(--text);min-width:0}
#stage input:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
#stage .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
#stage .acts .btn{flex:1 1 auto}
#stage .small{font-size:14px;color:var(--green)}
#stage .score{display:flex;flex-direction:column;gap:6px;margin:2px 0}
#stage .score div{display:flex;justify-content:space-between;padding:10px 14px;background:var(--offwhite);font:500 16px/1 var(--f-text);color:var(--text)}
#stage .score div.win{background:var(--green);color:var(--light)}
#stage .score b{font-weight:700;font-variant-numeric:tabular-nums}
#stage.curtain .tile{background:transparent;box-shadow:none;text-align:center;align-items:center;max-width:420px}
#stage.curtain h2{color:var(--light);font-size:34px}
#stage.curtain p{color:var(--light);opacity:.9}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- focus view ---------- */
#focus{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px))}
#focus .bg{position:absolute;inset:0;background:rgba(18,30,8,.66);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#focus .big{position:relative;width:var(--bw);height:calc(var(--bw) * 89 / 63);border-radius:calc(var(--bw) * .05);overflow:hidden;box-shadow:0 40px 80px rgba(var(--shadow),.55),0 6px 16px rgba(var(--shadow),.35);container-type:inline-size;background:var(--card)}
#focus .big img{width:100%;height:100%;display:block}
#fpanel{position:relative;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;width:min(var(--bw),100%)}
#fpanel:empty{display:none}
#fpanel .ibtn{height:50px}
#focus textarea{flex:1 1 100%;min-height:72px;resize:vertical;border:2px solid var(--light);border-radius:0;background:var(--offwhite);padding:10px 12px;font:400 16px/1.4 var(--f-text);color:var(--text)}
#focus label{flex:1 1 100%;font:600 12px/1 var(--f-text);letter-spacing:.1em;text-transform:uppercase;color:var(--light)}
#fclose{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:max(18px,env(safe-area-inset-right,0px));width:48px;height:48px;padding:0}

/* ---------- box CTA ---------- */
#cta{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
#cta .bg{position:absolute;inset:0;background:rgba(18,30,8,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#cta .tile{position:relative;max-width:460px;width:100%;padding:30px;display:flex;flex-direction:column;gap:16px;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
#cta h2{margin:0;padding-right:40px;font:600 30px/1.05 var(--f-display);letter-spacing:-.03em;color:var(--green);text-wrap:balance}
#cta p{margin:0;font:400 17px/1.45 var(--f-text);color:var(--text)}
#cta .price{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#cta .pill{background:var(--green);color:var(--light);border-radius:99px;padding:10px 18px;font:600 22px/1 var(--f-display);letter-spacing:-.01em}
#cta .note{font:400 14px/1.35 var(--f-text);color:var(--green);max-width:24ch}
#cta .buy{height:54px;margin-top:6px}
#ctaClose{position:absolute;top:16px;right:16px}

    <div class="price"><span class="pill">1190 грн</span><span class="note">Для організацій діють знижки від 10 примірників.</span></div>

  </div>

<script>
(()=>{
const CW=200, CH=283;
const BUY='https://maisternia-youth-work.com.ua/buy';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SP=RM?.35:1;
const IC={
  plus:'<svg class="i" viewBox="0 0 20 20"><path d="M10 3v14M3 10h14"/></svg>',
  minus:'<svg class="i" viewBox="0 0 20 20"><path d="M3 10h14"/></svg>',
  round:'<svg class="i" viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M15 2.5v4h-4"/></svg>',
  fs:'<svg class="i" viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>',
  check:'<svg class="i" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9"/></svg>',
  skip:'<svg class="i" viewBox="0 0 20 20"><path d="M4 4l7 6-7 6M12 4v12"/></svg>'
};

/* ---------- demo set (Viktor will replace) ---------- */
const TOOLS=[[1,'Мозковий штурм'],[3,'Вулична робота'],[6,'Делегувати молоді'],[7,'Нічого не робити'],[10,'Молодь як декорація'],
[33,'Настільні ігри'],[34,'Кіноперегляд'],[42,'Фестиваль'],[65,'Фокус-група'],[66,'Анкетування'],[70,'Мапування у громаді'],
[85,'Бесіда'],[87,'Дебати'],[89,'Фасилітована сесія'],[116,'Вулична акція'],[117,'Тренінг'],[120,'Форум-театр'],[133,'Світове кафе']];
const SPECIAL=[[23,'Крінж-режим'],[26,'Факап-режим']];   // only on the free table
const SITS=[[4,'Ви організували захід для молоді, проте на нього прийшло лише 3 людини з очікуваних 25.'],[6,'«Наша молодь пасивна!» — сказали працівники місцевого молодіжного центру.'],
[10,'Молодь втомилась від одноманітного навчання.'],[26,'Парк у громаді не є «дружнім до молоді».'],[1,'Порожня картка для вашої ситуації']];
const MODES=[{id:'stil',label:'Вільний стіл'},{id:'trening',label:'Для тренінгу'},{id:'basic',label:'Базова гра'},{id:'guess',label:'Вгадай слово'}];

const $=s=>document.querySelector(s);
const vp=$('#viewport'),world=$('#world');
const store={get(k,d){try{const v=localStorage.getItem('mm3-'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('mm3-'+k,JSON.stringify(v))}catch(e){}}};
const S={mode:'stil',orient:'land',W:1600,H:1000,n:store.get('n',6),hints:store.get('hints',true),
  zoomRel:1,fit:1,panX:0,panY:0,Z:10,chosen:null,focus:null,hires:false,step:0,note:null};
const jitter=a=>(Math.random()*2-1)*a;
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const wait=ms=>new Promise(r=>setTimeout(r,ms*SP));

/* ---------- cards ---------- */
const cards=[];
function mkCard(kind,n,name,special){
  const el=document.createElement('div');el.className='card';el.hidden=true;el.tabIndex=0;
  el.setAttribute('role','button');el.setAttribute('aria-label',(kind==='s'?'Ситуація: ':'Інструмент: ')+name);
  el.innerHTML=`<div class="sh sh-soft"></div><div class="sh sh-contact"></div><div class="flip"><div class="face front"><img alt="" draggable="false" src="cards/${kind}${n}s.webp"><div class="custom"></div></div><div class="face back"><img alt="" draggable="false" src="cards/back-${kind}.webp"></div></div><div class="badge">✓ Обрано</div>`;
  world.appendChild(el);
  const c={id:cards.length,kind,n,name,special,blank:kind==='s'&&n===1,el,x:0,y:0,r:0,jr:0,face:1,base:1,lift:0,liftT:0,place:'deck',at:null,text:'',hx:0,hy:0,
    flip:el.querySelector('.flip'),soft:el.querySelector('.sh-soft'),contact:el.querySelector('.sh-contact'),img:el.querySelector('.front img'),custom:el.querySelector('.custom')};
  el._c=c;cards.push(c);return c;
}
TOOLS.forEach(([n,t])=>mkCard('t',n,t,false));
SPECIAL.forEach(([n,t])=>mkCard('t',n,t,true));
SITS.forEach(([n,t])=>mkCard('s',n,t,false));

/* ---------- decks ---------- */
function mkDeck(kind,label){
  const el=document.createElement('div');el.className='deck';el.tabIndex=0;el.setAttribute('role','button');
  el.innerHTML=`<div class="stack"><img alt="" src="cards/back-${kind}.webp"></div><div class="label">${label} <b></b></div>`;
  world.appendChild(el);
  return {kind,el,x:0,y:0,order:[],stack:el.querySelector('.stack'),count:el.querySelector('.label b'),labelEl:el.querySelector('.label'),label};
}
const decks={s:mkDeck('s','Ситуації'),t:mkDeck('t','Інструменти')};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function resetDecks(){
  const blank=cards.find(c=>c.blank).id;
  const rest=shuffle(cards.filter(c=>c.kind==='s'&&!c.blank).map(c=>c.id));
  rest.splice(rest.length-1,0,blank);decks.s.order=rest;           // the blank situation is the second one drawn
  decks.t.order=shuffle(cards.filter(c=>c.kind==='t').map(c=>c.id));
}
resetDecks();
const allowSpecial=c=>!c.special||S.mode==='stil';
function available(d){return d.order.filter(id=>allowSpecial(cards[id]))}
function drawFrom(d){
  for(let i=d.order.length-1;i>=0;i--){const c=cards[d.order[i]];if(!allowSpecial(c))continue;
    if(c.blank&&!S.sitDraws&&d.order.length>1)continue;   // never open a session with the blank situation
    d.order.splice(i,1);if(c.kind==='s')S.sitDraws=(S.sitDraws||0)+1;return c}
  return null;
}
function renderDeck(d){
  const n=available(d).length;
  d.el.classList.toggle('empty',n===0);
  d.count.textContent='· '+n;
  const L=Math.min(n,14),sh=[];
  for(let i=1;i<=L;i++){const o=i*1.15;sh.push(`${o*.75}px ${o}px 0 ${i%2?'#C9DDB0':'#B7CB9C'}`)}
  sh.push(`${L*.9+6}px ${L*1.15+10}px 18px rgba(14,24,6,.5)`,`${L*.9+2}px ${L*1.15+3}px 4px rgba(14,24,6,.35)`);
  d.stack.style.boxShadow=n?sh.join(','):'none';
  d.labelEl.style.top=(CH+L*1.15+(S.orient==='port'?24:20))+'px';d.labelEl.style.left=(L*.75/2)+'px';
  d.el.setAttribute('aria-label',`Колода «${d.label}», карток: ${n}`);
}

/* ---------- box ---------- */
const boxcam=document.createElement('div');boxcam.className='boxcam';
const box=document.createElement('div');box.id='box';box.tabIndex=0;box.setAttribute('role','button');box.setAttribute('aria-label','Коробка гри — отримати всі картки');
box.innerHTML=`<div class="bshadow"></div><div class="bshadow c"></div><div class="b3d"><div class="lid"><div class="f core"></div><div class="f top"></div><div class="f up"></div><div class="f down"></div><div class="f left"></div><div class="f right"></div></div></div>`;
boxcam.appendChild(box);world.appendChild(boxcam);

/* ---------- slots, labels, timer ---------- */
const slotEls=[];
for(let i=0;i<10;i++){const e=document.createElement('div');e.className='slot off';world.insertBefore(e,world.firstChild);slotEls.push(e)}
const labelEls=[];
function labels(list){ // list: [{x,y,html,cls}]
  while(labelEls.length<list.length){const e=document.createElement('div');e.className='wlabel';world.insertBefore(e,world.firstChild);labelEls.push(e)}
  labelEls.forEach((e,i)=>{const L=list[i];if(!L){e.hidden=true;return}e.hidden=false;e.innerHTML=L.html;e.className='wlabel '+(L.cls||'');e.style.width=(L.w||260)+'px';e.style.transform=`translate(${L.x-(L.w||260)/2}px,${L.y}px)`});
}
const timerEl=document.createElement('div');timerEl.className='wtimer';timerEl.hidden=true;
timerEl.innerHTML='<svg viewBox="0 0 150 150"><circle class="bgc" cx="75" cy="75" r="64"/><circle class="fg" cx="75" cy="75" r="64" stroke-dasharray="402.1" stroke-dashoffset="0"/></svg><span>60</span>';
world.appendChild(timerEl);

/* ---------- layout ---------- */
let LAY;
function computeLayout(){
  const L={},land=S.orient==='land',m=S.mode;
  if(land){
    S.W=1600;S.H=1000;
    L.deckS=[150,160];L.deckT=[150,540];L.box=[1520,165,8];
    L.center=[900,500];
    L.ring=S.n===8?[[640,170],[900,170],[1160,170],[1420,500],[1160,830],[900,830],[640,830],[380,500]]
                  :[[770,170],[1030,170],[1420,500],[1030,830],[770,830],[380,500]];
    L.free=[[480,230],[710,230],[940,230],[1170,230],[600,560],[830,560],[1060,560],[1290,560],[480,850],[710,850],[940,850],[1170,850]];
    L.area=[440,160,1420,860];
    // basic game
    L.sit=[900,250];L.seatY=[590,775,885];L.seatBase=.85;L.seatGap=230;L.seatCx=900;L.wonBase=.38;
    L.hand=j=>[900+(j-2.5)*205,640+Math.pow(Math.abs(j-2.5),2)*7,(j-2.5)*2.4,1];
    // word game
    if(m==='guess'){L.deckT=[150,160];L.deckS=[-500,160];}
    L.skip=[150,540];L.gcenter=[860,520];L.gbase=1.9;L.timer=[860,108];
    L.team=(t,T)=>{const ys={2:[460,740],3:[380,600,820],4:[340,520,700,880]}[T];return [1400,ys[t],.5]};
    // stretch the 1600×1000 design to the free screen area
    const A=availAspect();
    if(A>1.6){S.W=Math.round(1000*A)}else{S.H=Math.round(1600/A)}
    const dx=(S.W-1600)/2,dy=(S.H-1000)/2,P=a=>[a[0]+dx,a[1]+dy,...a.slice(2)];
    ['center','sit','gcenter','timer'].forEach(k=>L[k]=P(L[k]));
    L.ring=L.ring.map(P);L.free=L.free.map(P);L.area=[L.area[0]+dx,L.area[1]+dy,L.area[2]+dx,L.area[3]+dy];
    L.seatY=L.seatY.map(y=>y+dy);L.seatCx+=dx;
    L.box=[S.W-50,165,8];
    const h=L.hand,t=L.team;L.hand=j=>P(h(j));L.team=(i,T)=>{const q=t(i,T);return [S.W-200,q[1]+dy,q[2]]};
  }else{
    S.W=880;S.H=1650;
    L.deckS=[140,1420];L.deckT=[420,1420];L.box=[805,1505,-8];
    L.center=[500,640];
    L.ring=S.n===8?[[220,230],[500,230],[780,230],[850,640],[780,1050],[500,1050],[220,1050],[150,640]]
                  :[[360,230],[640,230],[850,640],[640,1050],[360,1050],[150,640]];
    L.free=[[180,210],[500,210],[820,210],[180,530],[500,530],[820,530],[180,850],[500,850],[820,850],[340,1110],[660,1110]];
    L.area=[120,150,880,1120];
    L.sit=[500,260];L.seatY=[730,880,985];L.seatBase=.68;L.seatGap=0;L.seatCx=500;L.wonBase=.3;
    L.hand=j=>[200+(j%3)*300,620+Math.floor(j/3)*290,jitter(0)+((j%3)-1)*2,.95];
    if(m==='guess'){L.deckT=[140,1420];L.deckS=[140,2300];}
    L.skip=[420,1420];L.gcenter=[500,660];L.gbase=2.25;L.timer=[500,200];
    L.team=(t,T)=>{const xs={2:[330,670],3:[200,500,800],4:[140,380,620,860]}[T];return [xs[t],1130,.45]};
    // squeeze the 1000-wide portrait design into 880: same layout, cards closer, the whole table fits ~12% larger
    const X=x=>440+(x-500)*.86, P=a=>[X(a[0]),...a.slice(1)];
    ['center','sit','gcenter','timer'].forEach(k=>L[k]=P(L[k]));
    L.deckS=[110,1420];L.deckT=[340,1420];L.skip=[340,1420];if(m==='guess'){L.deckT=[110,1420];L.deckS=[110,2300]}
    L.box=[815,1500,-8];
    L.ring=L.ring.map(P);L.free=L.free.map(P);L.area=[X(L.area[0]),L.area[1],X(L.area[2]),L.area[3]];L.seatCx=440;
    const h=L.hand,t=L.team;L.hand=j=>P(h(j));L.team=(i,T)=>P(t(i,T));
  }
  return L;
}
function availAspect(){
  const i=insets(),aw=Math.max(300,innerWidth-i.l-i.r),ah=Math.max(300,innerHeight-i.t-i.b);return aw/ah;
}
function seatX(p,N){
  if(S.orient==='land')return LAY.seatCx+(p-(N-1)/2)*LAY.seatGap;
  return 440+((({3:[200,500,800],4:[140,380,620,860]}[N]||[500])[p])-500)*.86;
}
function place(el,x,y,extra=''){el.style.transform=`translate3d(${x-100}px,${y-141.5}px,0)${extra}`}
function applyStatic(){
  world.style.width=S.W+'px';world.style.height=S.H+'px';
  world.classList.toggle('port',S.orient==='port');world.classList.toggle('game',S.mode==='basic'||S.mode==='guess');
  world.style.perspectiveOrigin=`${S.W/2}px ${S.H/2}px`;
  [['s',LAY.deckS],['t',LAY.deckT]].forEach(([k,p])=>{const d=decks[k];d.x=p[0];d.y=p[1];place(d.el,d.x,d.y);renderDeck(d)});
  const b=LAY.box;box.style.transform=`translate3d(${b[0]-166.5}px,${b[1]-238}px,0) rotateZ(${b[2]}deg)`;
  // look at the box from the front edge of the table, like a person sitting there
  boxcam.style.perspectiveOrigin=`${b[0]-260}px ${b[1]+(S.orient==='port'?520:560)}px`;
  // slot outlines
  slotEls.forEach(e=>{e.classList.add('off');e.textContent=''});
  if(S.mode==='trening'){
    place(slotEls[0],LAY.center[0],LAY.center[1],' scale(1.2)');slotEls[0].textContent='Ситуація';slotEls[0].classList.toggle('off',!!slotCard('center'));
    LAY.ring.forEach((p,i)=>{const e=slotEls[i+1];place(e,p[0],p[1]);e.classList.toggle('off',!!slotCard('ring:'+i))});
  }else if(S.mode==='basic'&&G.players.length){
    place(slotEls[0],LAY.sit[0],LAY.sit[1]);slotEls[0].textContent='Ситуація';slotEls[0].classList.toggle('off',!!slotCard('sit'));
  }else if(S.mode==='guess'){
    const e=slotEls[0];place(e,LAY.skip[0],LAY.skip[1]);e.textContent='Пропущені';e.classList.toggle('off',W.skip.length>0);
    const e2=slotEls[1];place(e2,LAY.gcenter[0],LAY.gcenter[1],` scale(${LAY.gbase})`);e2.classList.toggle('off',!!slotCard('gcenter')||W.phase==='setup');
  }
  renderLabels();
}
function slotCard(key){return cards.find(c=>c.at===key&&c.place!=='deck')}
const onTable=()=>cards.filter(c=>c.place==='table');

/* ---------- positions per key ---------- */
function posFor(c){
  const a=c.at||'',k=a.split(':');
  switch(k[0]){
    case 'free':return {x:c.hx,y:c.hy,r:c.jr,base:1,face:0};
    case 'center':return {x:LAY.center[0],y:LAY.center[1],r:c.jr,base:1.2,face:0};
    case 'ring':{const p=LAY.ring[+k[1]];return p?{x:p[0],y:p[1],r:c.jr,base:1,face:0}:null}
    case 'sit':return {x:LAY.sit[0],y:LAY.sit[1],r:c.jr,base:1,face:0};
    case 'played':{const p=+k[1];return {x:seatX(p,G.players.length),y:LAY.seatY[0],r:c.jr,base:LAY.seatBase,face:G.revealed?0:1}}
    case 'won':{const p=+k[1],i=+k[2];return {x:seatX(p,G.players.length)-30+i*22,y:LAY.seatY[2]+i*6,r:-6+i*5,base:LAY.wonBase,face:0}}
    case 'hand':{const h=LAY.hand(+k[1]);return {x:h[0],y:h[1],r:h[2],base:h[3],face:0}}
    case 'gcenter':return {x:LAY.gcenter[0],y:LAY.gcenter[1],r:c.jr,base:LAY.gbase,face:0};
    case 'team':{const t=+k[1],i=+k[2],p=LAY.team(t,W.teams.length);return {x:p[0]+i*3,y:p[1]+i*4,r:c.jr,base:p[2],face:0}}
    case 'skip':{const i=+k[1];return {x:LAY.skip[0]+i*3,y:LAY.skip[1]+i*4,r:c.jr,base:1,face:0}}
  }
  return null;
}
function relayout(o={}){
  onTable().forEach(c=>{
    if(drag&&drag.c===c)return;
    const t=posFor(c);if(!t)return;
    const isNew=o.fresh&&o.fresh.has(c);
    if(!isNew&&!tweens.has(c)&&Math.abs(c.x-t.x)<.5&&Math.abs(c.y-t.y)<.5&&Math.abs(c.base-t.base)<.005&&Math.abs(c.face-t.face)<.01)return;
    animate(c,t,{dur:isNew?700:560,delay:(o.delays&&o.delays.get(c))||0,arc:isNew?1:.35});
  });
}

/* ---------- render & motion ---------- */
function draw(c){
  const l=Math.max(0,c.lift),s=c.base*(1+.065*l);
  c.el.style.transform=`translate3d(${c.x-100}px,${c.y-141.5}px,0) rotate(${c.r}deg) scale(${s})`;
  c.flip.style.transform=`rotateY(${c.face*180}deg)`;
  c.soft.style.transform=`translate(${(5+20*l)/s}px,${(7+30*l)/s}px) scale(${1+.03*l})`;
  c.soft.style.opacity=(.5-.12*l).toFixed(3);
  c.contact.style.opacity=(.6*(1-Math.min(1,l*1.6))).toFixed(3);
}
const tweens=new Map();let raf=0,drag=null;
const ease=t=>1-Math.pow(1-t,3.1);
const back=t=>{const k=1.25;return 1+(k+1)*Math.pow(t-1,3)+k*Math.pow(t-1,2)};
const smooth=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
function animate(c,to,o={}){
  const from={x:c.x,y:c.y,r:c.r,face:c.face,base:c.base};
  const tx=to.x??c.x,ty=to.y??c.y,dx=tx-c.x,dy=ty-c.y,dist=Math.hypot(dx,dy);
  const bend=Math.min(70,dist*.09)*(Math.random()<.5?-1:1)*(o.arc??1);
  tweens.set(c,{from,to:{x:tx,y:ty,r:to.r??c.r,face:to.face??c.face,base:to.base??c.base},
    t0:performance.now()+(o.delay||0)*SP,dur:(o.dur||640)*SP,arc:RM?0:(o.arc??1),nx:dist?-dy/dist:0,ny:dist?dx/dist:0,bend,lf:o.liftFrom||0,done:o.done});
  kick();
}
function kick(){if(!raf)raf=requestAnimationFrame(tick)}
function tick(now){
  raf=0;let busy=false;
  tweens.forEach((tw,c)=>{
    let t=(now-tw.t0)/tw.dur;
    if(t<0){busy=true;return}
    if(t>=1)t=1;
    const e=ease(t),off=Math.sin(Math.PI*t)*tw.bend;
    c.x=tw.from.x+(tw.to.x-tw.from.x)*e+tw.nx*off;
    c.y=tw.from.y+(tw.to.y-tw.from.y)*e+tw.ny*off;
    c.r=tw.from.r+(tw.to.r-tw.from.r)*back(t);
    c.base=tw.from.base+(tw.to.base-tw.from.base)*e;
    c.face=tw.from.face+(tw.to.face-tw.from.face)*smooth((t-.08)/.6);
    c.lift=Math.max(tw.arc*Math.pow(Math.sin(Math.PI*t),.85),tw.lf*(1-e));
    draw(c);
    if(t>=1){tweens.delete(c);c.lift=0;c.liftT=0;draw(c);tw.done&&tw.done()}else busy=true;
  });
  cards.forEach(c=>{
    if(tweens.has(c))return;
    if(drag&&drag.c===c){busy=true;return}
    if(Math.abs(c.lift-c.liftT)>.002){c.lift+=(c.liftT-c.lift)*.22;if(Math.abs(c.lift-c.liftT)<.003)c.lift=c.liftT;draw(c);busy=true}
  });
  if(busy)kick();
}
function front(c){c.el.style.zIndex=++S.Z}

/* ---------- common card actions ---------- */
function atDeck(c){const d=decks[c.kind];c.x=d.x;c.y=d.y;c.r=jitter(1.5);c.face=1;c.base=1;c.lift=0;draw(c);c.el.hidden=false;front(c);renderDeck(d)}
function putOn(c,key,jr){c.place='table';c.at=key;c.jr=jr??jitter(3)}
function collect(c,delay=0){
  const d=decks[c.kind];
  if(S.chosen===c)setChosen(null);
  c.place='deck';c.at=null;c.el.classList.remove('ring');c.text&&c.blank&&(c.custom.textContent=c.text);
  if(c.el.hidden){d.order.unshift(c.id);renderDeck(d);return}
  front(c);
  animate(c,{x:d.x,y:d.y,r:jitter(1.5),face:1,base:1},{dur:520,delay,arc:.8,done:()=>{c.el.hidden=true;d.order.unshift(c.id);renderDeck(d)}});
}
function collectAll(){
  let i=0;cards.filter(c=>c.place!=='deck').forEach(c=>collect(c,(c.el.hidden?0:(i++)*40)));
}
/* fly a card to (x,y) small and hide it (into a player's hand) */
function stash(c,x,y,delay=0){
  front(c);animate(c,{x,y,base:.3,face:1,r:jitter(8)},{dur:480,delay,arc:.6,done:()=>{c.el.hidden=true}});
}

/* ================= FREE TABLE ================= */
function freeSpot(){
  const used=onTable();
  for(const p of LAY.free){if(!used.some(c=>Math.hypot(c.hx-p[0],c.hy-p[1])<90))return [p[0]+jitter(14),p[1]+jitter(14)]}

}
function freeDraw(k){

  [c.hx,c.hy]=freeSpot();putOn(c,'free',jitter(4));atDeck(c);relayout({fresh:new Set([c])});

/* ================= TRAINING ================= */

/* ================= BASIC GAME (one device, hot seat) ================= */
const G={players:[],target:2,leader:0,phase:'setup',queue:[],cur:null,revealed:false,count:3,names:store.get('bnames',['','','',''])};
function basicSetup(){

      <div class="names" id="names">${nameInputs()}</div>
      <p class="small">У демо — 3 гравці, гра до 2 балів і без додаткових карток. У повній грі — від 3 до 8 гравців.</p>`,

async function basicStart(){
  for(let i=0;i<G.count;i++){const el=$('#pn'+i);if(el)G.names[i]=el.value.trim()}
  store.set('bnames',G.names);
  G.players=Array.from({length:G.count},(_,i)=>({name:G.names[i]||`Гравець ${i+1}`,hand:[],won:[]}));
  G.leader=0;G.revealed=false;hideStage();
  collectAll();await wait(650);resetDecks();applyStatic();
  // deal six cards to every player: they fly to the player's seat and stay hidden
  let d=0;
  for(let r=0;r<6;r++)for(let p=0;p<G.players.length;p++){
    const c=drawFrom(decks.t);c.place='hand';c.at=null;c.owner=p;G.players[p].hand.push(c);
    atDeck(c);stash(c,seatX(p,G.players.length),LAY.seatY[1]+20,d);d+=45;
  }

}
function basicLead(){
  G.phase='lead';G.revealed=false;applyStatic();
  const L=G.players[G.leader];
  stage({title:`Ведучий — ${esc(L.name)}`,text:'Витягніть картку ситуації й прочитайте її вголос.',acts:[{label:'Витягнути ситуацію',primary:true,fn:basicDrawSit}],dock:true});
  updateHint();
}
function basicDrawSit(){
  const c=drawFrom(decks.s);if(!c){basicFinal();return}
  hideStage();putOn(c,'sit',jitter(1.2));atDeck(c);relayout({fresh:new Set([c])});applyStatic();
  G.phase='read';
  G.queue=[];for(let i=1;i<G.players.length;i++)G.queue.push((G.leader+i)%G.players.length);
  setTimeout(()=>{
    stage({text:c.blank?`Порожня картка: ${esc(G.players[G.leader].name)} вигадує свою ситуацію. Натисніть на картку, щоб вписати її.`:'Прочитали ситуацію? Тепер гравці по черзі таємно обирають інструмент.',acts:[{label:'Далі',primary:true,fn:basicPass}],dock:true});
    updateHint();
  },700*SP);
}
function basicPass(){
  if(!G.queue.length){basicRevealPrompt();return}
  const p=G.queue[0];G.phase='pass';G.cur=p;renderLabels();
  stage({title:`Хід: ${esc(G.players[p].name)}`,text:'Передайте пристрій. Інші гравці не дивляться на екран, поки ви обираєте.',acts:[{label:'Показати мої картки',primary:false,light:true,fn:()=>basicShowHand(p)}],curtain:true});
  updateHint();
}
function basicShowHand(p){
  hideStage();G.phase='choose';G.cur=p;
  const P=G.players[p],fresh=new Set(),delays=new Map(),sx=seatX(p,G.players.length);
  P.hand.forEach((c,j)=>{c.place='table';c.at='hand:'+j;c.x=sx;c.y=LAY.seatY[1];c.base=.3;c.face=1;c.r=0;draw(c);c.el.hidden=false;front(c);fresh.add(c);delays.set(c,j*70)});
  relayout({fresh,delays});renderLabels();updateHint();
}
function basicPlay(c){
  const p=G.cur,P=G.players[p];
  P.hand=P.hand.filter(x=>x!==c);P.played=c;c.at='played:'+p;c.jr=jitter(3);
  front(c);relayout();
  const sx=seatX(p,G.players.length);
  P.hand.forEach((h,i)=>{h.place='hand';h.at=null;stash(h,sx,LAY.seatY[1]+20,i*40)});

  setTimeout(basicPass,900*SP);
}
function basicRevealPrompt(){
  G.phase='pass';G.cur=null;renderLabels();
  stage({title:'Усі обрали!',text:'Покладіть пристрій так, щоб усі бачили екран.',acts:[{label:'Розкрити картки',light:true,fn:basicReveal}],curtain:true});
  updateHint();
}
function basicReveal(){
  hideStage();G.revealed=true;G.phase='judge';
  const delays=new Map();let i=0;onTable().filter(c=>c.at&&c.at.startsWith('played')).forEach(c=>delays.set(c,(i++)*260));
  relayout({delays});renderLabels();
  setTimeout(()=>{stage({text:`По черзі поясніть свій вибір. <b>${esc(G.players[G.leader].name)}</b>, оберіть найкращий інструмент: натисніть на картку.`,dock:true});updateHint()},(i*260+500)*SP);
}
async function basicAward(p){
  hideStage();
  const sit=slotCard('sit'),P=G.players[p];
  if(sit){sit.at=`won:${p}:${P.won.length}`;P.won.push(sit);front(sit)}
  relayout();renderLabels();await wait(700);
  G.players.forEach(pl=>{if(pl.played){collect(pl.played);pl.played=null}});
  await wait(500);
  // everyone except the leader draws back up to six
  let d=0;G.players.forEach((pl,i)=>{
    if(i===G.leader)return;
    while(pl.hand.length<6){const c=drawFrom(decks.t);if(!c)break;c.place='hand';c.owner=i;pl.hand.push(c);atDeck(c);stash(c,seatX(i,G.players.length),LAY.seatY[1]+20,d);d+=80}
  });
  await wait(d+400);
  if(P.won.length>=G.target||available(decks.s).length===0){basicFinal();return}
  G.leader=(G.leader+1)%G.players.length;basicLead();
}
function basicFinal(){
  G.phase='final';renderLabels();

  const title=winners.length===1?`${esc(winners[0].name)} — Майстер молодіжної роботи!`:'Нічия!';
  const rows=[...G.players].sort((a,b)=>b.won.length-a.won.length).map(p=>`<div class="${p.won.length===max?'win':''}"><span>${esc(p.name)}</span><b>${p.won.length}</b></div>`).join('');

    acts:[{label:'Зіграти ще',fn:basicSetup},{label:'Купити гру',primary:true,href:BUY}],dim:true});
  updateHint();
}

/* ---------- camera: fit / zoom / pan ---------- */
function insets(){
  const vw=innerWidth,vh=innerHeight,narrow=vw<=760;
  const t=$('#top').getBoundingClientRect(),b=$('#bar').getBoundingClientRect(),h=$('#helpBtn').getBoundingClientRect();
  const bottom=Math.max(vh-b.top,vh-h.top+6);
  return {l:narrow?8:30,r:narrow?8:30,t:t.bottom+(narrow?8:14),b:bottom+(narrow?8:14)};
}
function fit(anim){
  const vw=innerWidth,vh=innerHeight,i=insets();
  const aw=Math.max(100,vw-i.l-i.r),ah=Math.max(100,vh-i.t-i.b);
  S.fit=Math.min(aw/S.W,ah/S.H);S.zoomRel=1;
  S.panX=i.l+(aw-S.W*S.fit)/2;S.panY=i.t+(ah-S.H*S.fit)/2;

/* ---------- pointer ---------- */
const ptrs=new Map();let gest=null;

  closeMenu();

  try{vp.setPointerCapture(e.pointerId)}catch(_){}
  if(ptrs.size===2){
    if(drag){drag.c.liftT=0;drag=null;kick()}
    const [a,b]=[...ptrs.values()];gest={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),rel0:S.zoomRel};return;
  }
  const cardEl=e.target.closest('.card'),deckEl=e.target.closest('.deck'),boxEl=e.target.closest('#box');
  if(cardEl){
    const c=cardEl._c;
    gest={type:'card',c,sx:e.clientX,sy:e.clientY,moved:false};
    if(canDrag()){tweens.delete(c);const [wx,wy]=toWorld(e.clientX,e.clientY);front(c);c.liftT=1;drag={c,ox:wx-c.x,oy:wy-c.y,lastX:e.clientX,vx:0,r0:c.r,t:performance.now()};kick()}
  }else if(deckEl)gest={type:'deck',k:deckEl===decks.s.el?'s':'t',sx:e.clientX,sy:e.clientY};
  else if(boxEl)gest={type:'box',sx:e.clientX,sy:e.clientY};

vp.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;

  if(gest.type==='pinch'&&ptrs.size===2){const [a,b]=[...ptrs.values()];zoomAt(gest.rel0*Math.hypot(a.x-b.x,a.y-b.y)/gest.d0,(a.x+b.x)/2,(a.y+b.y)/2,false);return}
  if(gest.type==='pan'){S.panX=gest.px+e.clientX-gest.sx;S.panY=gest.py+e.clientY-gest.sy;clampPan();applyView(false);return}
  if(gest.type==='card'){
    if(!gest.moved&&Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy)>6)gest.moved=true;
    if(!gest.moved||!drag)return;
    const [wx,wy]=toWorld(e.clientX,e.clientY),c=drag.c,now=performance.now(),dt=Math.max(8,now-drag.t);
    drag.vx=drag.vx*.7+((e.clientX-drag.lastX)/dt)*.3;drag.lastX=e.clientX;drag.t=now;
    c.x=wx-drag.ox;c.y=wy-drag.oy;

});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;

  gest=null;vp.classList.remove('panning');
  const tap=Math.hypot(e.clientX-g.sx,e.clientY-g.sy)<8;
  if(g.type==='card'){
    const c=g.c;
    if(drag){const r0=drag.r0;drag=null;c.liftT=0;
      if(g.moved){const rr=r0+(c.r-r0)*.25;animate(c,{r:rr},{dur:320,arc:0,liftFrom:c.lift});if(c.at==='free'){c.hx=c.x;c.hy=c.y}c.jr=rr;kick();return}
      c.lift=0;draw(c);
    }

const F=$('#focus'),big=$('#big'),bigImg=$('#bigImg'),bigCustom=$('#bigCustom'),fpanel=$('#fpanel');
function focusActions(c){
  const a=c.at||'';
  if(S.mode==='trening'&&a.startsWith('ring'))return [{label:S.chosen===c?'Зняти позначку':'Обрати цей інструмент',fn:()=>setChosen(S.chosen===c?null:c)}];
  if(S.mode==='basic'&&G.phase==='choose'&&a.startsWith('hand'))return [{label:'Покласти цю картку',fn:()=>basicPlay(c)}];
  if(S.mode==='basic'&&G.phase==='judge'&&a.startsWith('played'))return [{label:'Найкращий інструмент',fn:()=>basicAward(+a.split(':')[1])}];
  return [];
}
function openFocus(c){
  if(c.face>.5)return;
  S.focus=c;
  const acts=focusActions(c);
  const panelH=(c.blank?170:0)+(acts.length?72:0);
  const bw=Math.min(innerWidth*.84,(innerHeight-panelH-150)*63/89,560);
  big.style.setProperty('--bw',bw+'px');
  bigImg.src=`cards/${c.kind}${c.n}l.webp`;bigImg.alt=c.name;bigCustom.textContent=c.text;
  fpanel.innerHTML='';
  if(c.blank){
    fpanel.insertAdjacentHTML('beforeend',`<label for="sitText">Ваша ситуація</label><textarea id="sitText" maxlength="160" placeholder="Опишіть ситуацію з вашої роботи"></textarea>`);

  F.hidden=false;

  F.querySelector('.bg').animate([{opacity:0},{opacity:1}],{duration:300*SP});
  [fpanel,$('#fclose')].forEach(el=>el.animate([{opacity:0},{opacity:1}],{duration:260*SP,delay:140*SP,fill:'backwards'}));
  (fpanel.querySelector('textarea')||fpanel.querySelector('.ibtn')||$('#fclose')).focus({preventScroll:true});
}
function closeFocus(){
  const c=S.focus;if(!c){F.hidden=true;return}
  const fr=c.el.querySelector('.front'),br=big.getBoundingClientRect();
  c.el.style.visibility='';const rr=fr.getBoundingClientRect();c.el.style.visibility='hidden';
  const z=S.fit*S.zoomRel,k=CW*c.base*z/br.width;

  const a=big.animate([{transform:'none'},{transform:`translate(${dx}px,${dy}px) rotate(${c.r}deg) scale(${k})`}],{duration:340*SP,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
  F.querySelector('.bg').animate([{opacity:1},{opacity:0}],{duration:300*SP,fill:'forwards'});

  if(m==='guess')return ({setup:'',intro:'Команда пояснювача не бачить екран.',turn:'Пояснюйте словами, без однокореневих слів. <b>Вгадали</b> чи <b>Пропустити</b> — кнопки внизу.',

  d.innerHTML=`<div class="tile"><h2>Спробуйте «Майстерню» онлайн</h2><p>Витягуйте картки, грайте базову гру чи «Вгадай слово» просто з телефона.</p><a class="btn fill big" href="${location.href.split('#')[0]}" target="_blank" rel="noopener">Відкрити гру</a></div>`;
  document.body.appendChild(d);
}

/* ---------- start ---------- */
S.orient=orientFor();
const startMode=MODES.some(m=>m.id===location.hash.slice(1))?location.hash.slice(1):'stil';
S.mode=startMode;LAY=computeLayout();setMode(startMode,true);
cards.forEach(c=>{const d=decks[c.kind];c.x=d.x;c.y=d.y;draw(c)});
if(startMode==='stil'){
  setTimeout(()=>{
    const fresh=new Set(),delays=new Map();
    const s=drawFrom(decks.s);s.hx=LAY.free[0][0]+10;s.hy=LAY.free[0][1]+6;putOn(s,'free',-3);atDeck(s);fresh.add(s);
    [1,2,3].forEach((k,i)=>{const c=drawFrom(decks.t);c.hx=LAY.free[k][0]+jitter(12);c.hy=LAY.free[k][1]+jitter(12);putOn(c,'free',jitter(4));atDeck(c);fresh.add(c);delays.set(c,160+i*120)});
    relayout({fresh,delays});
  },450);
}
document.fonts&&document.fonts.ready.then(()=>fit(false));
})();
</script>

<!-- Позначки демо: пігулка «ДЕМО» і заблоковані картки -->
<script>
/* «Майстерня» — позначки демо.
   1) Пігулка «ДЕМО» одразу після логотипа (за макетом Figma, node 511-169).
   2) Коли колода (інструменти чи ситуації) закінчилась — на її місці
      розмита картка з замком. Натиснули на неї — плашка «Купити гру».
   Основний код демо не змінюється. */
(function () {
  'use strict';

  var BUY_URL = 'https://maisternia-youth-work.com.ua/buy';
  var TIP_TITLE = 'Більше карток у повній грі';
  var TIP_TEXT = 'У коробці 122 інструменти, 40 ситуацій і 16 додаткових карток.';
  var TIP_BTN = 'Придбати гру';

  /* ---------- стилі ---------- */
  var css = '' +
    /* пігулка: розміри відносно логотипа (у Figma лого 42 px, пігулка 35 px, заходить на лого на 4 px) */
    '#demoPill{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;flex:none;' +
    'box-sizing:border-box;height:calc(var(--logo-h,42px)*0.8333);padding:0 calc(var(--logo-h,42px)*0.238);' +
    'margin-left:calc(var(--logo-h,42px)*-0.095);align-self:center;transform:translateY(calc(var(--logo-h,42px)*0.083));' +
    'border-radius:999px;background:#476036;color:#E5F1D4;' +
    'font-family:"Fixel Text",system-ui,-apple-system,Arial,sans-serif;font-weight:600;' +
    'font-size:calc(var(--logo-h,42px)*0.31);line-height:1;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;' +
    'pointer-events:none;user-select:none}' +

    /* заблокована картка поверх порожньої колоди */
    '.demoLocked{position:absolute;left:0;top:0;width:100%;height:100%;z-index:5;cursor:pointer;' +
    'border-radius:7px;overflow:hidden;background:var(--card,#DEF2C5);' +
    'box-shadow:0 2px 3px rgba(var(--shadow,14,24,6),.35),0 8px 18px rgba(var(--shadow,14,24,6),.25)}' +
    '.demoLocked img{display:block;width:100%;height:100%;object-fit:cover;filter:blur(6px);transform:scale(1.1);opacity:.85;pointer-events:none}' +
    '.demoLocked .dl-veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12%;' +
    'background:rgba(222,242,197,.62)}' +
    '.demoLocked .dl-lock{width:52%;aspect-ratio:1;border-radius:50%;background:var(--deep,#40542D);display:grid;place-items:center}' +
    '.demoLocked .dl-lock svg{width:48%;height:48%;fill:none;stroke:var(--light,#E5F1D4);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}' +
    '.demoLocked .dl-cap{font:700 13px/1.15 var(--f-text,"Fixel Text",Arial,sans-serif);letter-spacing:.08em;text-transform:uppercase;' +
    'color:var(--deep,#40542D);text-align:center;padding:0 6px}' +
    '.demoLocked:focus-visible{outline:3px solid var(--light,#E5F1D4);outline-offset:3px}' +

    /* плашка «Купити гру» (поза столом, щоб не масштабувалась разом із ним) */
    '#demoBuyTip{position:fixed;z-index:1000;box-sizing:border-box;width:280px;max-width:calc(100vw - 32px);' +
    'padding:16px 16px 14px;border-radius:16px;background:var(--light,#E5F1D4);color:var(--text,#1d2814);' +
    'box-shadow:0 8px 24px rgba(var(--shadow,14,24,6),.3)}' +
    '#demoBuyTip[hidden]{display:none}' +
    '#demoBuyTip h4{margin:0 26px 6px 0;font:600 16px/1.15 var(--f-text,"Fixel Text",Arial,sans-serif);color:var(--green,#51643C)}' +
    '#demoBuyTip p{margin:0 0 12px;font:400 13px/1.4 var(--f-text,"Fixel Text",Arial,sans-serif)}' +
    '#demoBuyTip a{display:inline-flex;align-items:center;height:38px;padding:0 16px;background:var(--green,#51643C);color:var(--light,#E5F1D4);' +
    'font:500 12px/1 var(--f-text,"Fixel Text",Arial,sans-serif);letter-spacing:.1em;text-transform:uppercase;text-decoration:none}' +
    '#demoBuyTip .dl-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;background:none;cursor:pointer;' +
    'color:var(--green,#51643C);font-size:20px;line-height:1}';

  var style = document.createElement('style');
  style.id = 'demoLimitStyles';
  style.textContent = css;
  document.head.appendChild(style);

  /* ---------- 1. пігулка «ДЕМО» ---------- */
  function addPill() {
    var logo = document.getElementById('logo');
    if (!logo || document.getElementById('demoPill')) return;
    var pill = document.createElement('span');
    pill.id = 'demoPill';
    pill.textContent = 'Демо';
    logo.insertAdjacentElement('afterend', pill);

    var img = logo.querySelector('img') || logo;
    function sync() {
      var h = img.getBoundingClientRect().height;
      if (h > 0) document.documentElement.style.setProperty('--logo-h', h + 'px');
      // у шапці між елементами є gap — компенсуємо його, щоб пігулка заходила на лого, як у Figma
      var parent = pill.parentElement;
      var gap = parent ? parseFloat(getComputedStyle(parent).columnGap) || 0 : 0;
      pill.style.marginLeft = 'calc(' + (-gap) + 'px + var(--logo-h,42px)*-0.095)';
    }
    sync();
    if (img.complete === false) img.addEventListener('load', sync);
    if (window.ResizeObserver) new ResizeObserver(sync).observe(img);
    window.addEventListener('resize', sync);
  }

  /* ---------- 2. заблоковані картки ---------- */
  var tip;
  function buildTip() {
    tip = document.createElement('div');
    tip.id = 'demoBuyTip';
    tip.setAttribute('role', 'dialog');
    tip.setAttribute('aria-label', TIP_TITLE);
    tip.hidden = true;
    tip.innerHTML =
      '<button class="dl-x" type="button" aria-label="Закрити">×</button>' +
      '<h4></h4><p></p><a target="_blank" rel="noopener"></a>';
    tip.querySelector('h4').textContent = TIP_TITLE;
    tip.querySelector('p').textContent = TIP_TEXT;
    var a = tip.querySelector('a');
    a.textContent = TIP_BTN;
    a.href = BUY_URL;
    tip.querySelector('.dl-x').addEventListener('click', hideTip);
    tip.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    tip.addEventListener('click', function (e) { e.stopPropagation(); });
    document.body.appendChild(tip);
  }

  function showTip(anchor) {
    if (!tip) buildTip();
    tip.hidden = false;
    var r = anchor.getBoundingClientRect();
    var w = tip.offsetWidth, h = tip.offsetHeight, gap = 14, m = 16;
    var vw = window.innerWidth, vh = window.innerHeight;
    var left = r.right + gap;
    if (left + w > vw - m) left = r.left - gap - w;          // не влазить праворуч — ліворуч
    if (left < m) left = Math.max(m, Math.min(vw - w - m, r.left)); // телефон — під карткою, по її лівому краю
    var top = r.top;
    if (left === r.right + gap || left === r.left - gap - w) {
      top = Math.min(Math.max(m, r.top), vh - h - m);
    } else {
      top = r.bottom + gap;                                    // під карткою
      if (top + h > vh - m) top = Math.max(m, r.top - gap - h);
    }
    tip.style.left = Math.round(left) + 'px';
    tip.style.top = Math.round(top) + 'px';
    var link = tip.querySelector('a');
    if (link && link.focus) link.focus({ preventScroll: true });
  }
  function hideTip() { if (tip) tip.hidden = true; }

  document.addEventListener('pointerdown', function (e) {
    if (tip && !tip.hidden && !e.target.closest('.demoLocked')) hideTip();
  }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideTip(); });
  window.addEventListener('wheel', hideTip, { passive: true });
  window.addEventListener('resize', hideTip);

  // зразок лицьової сторони для розмиття: будь-яка картка цієї колоди, що вже є на сторінці
  function faceFor(kind) {
    var re = kind === 's' ? /\/cards\/s\d+s?\.webp/ : /\/cards\/t\d+s?\.webp/;
    var imgs = document.images;
    for (var i = 0; i < imgs.length; i++) if (re.test(imgs[i].src)) return imgs[i].src;
    return 'cards/back-' + kind + '.webp';
  }

  function deckKind(deck) {
    var label = deck.querySelector('.label');
    var t = (label ? label.textContent : deck.textContent || '').toLowerCase();
    if (t.indexOf('ситуац') !== -1) return 's';
    if (t.indexOf('інструмент') !== -1) return 't';
    return null;
  }

  function deckCount(deck) {
    var label = deck.querySelector('.label');
    var m = (label ? label.textContent : '').match(/(\d+)\s*$/);
    return m ? parseInt(m[1], 10) : null;
  }

  function lockDeck(deck, kind) {
    if (deck.querySelector(':scope > .demoLocked')) return;
    if (getComputedStyle(deck).position === 'static') deck.style.position = 'relative';
    var el = document.createElement('div');
    el.className = 'demoLocked';
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', 'Колода закінчилась. ' + TIP_TITLE);
    el.innerHTML =
      '<img alt="">' +
      '<div class="dl-veil"><div class="dl-lock"><svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>' +
      '<div class="dl-cap">Повна гра</div></div>';
    el.querySelector('img').src = faceFor(kind);
    var open = function (e) { e.preventDefault(); e.stopPropagation(); showTip(el); };
    el.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    el.addEventListener('click', open);
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') open(e); });
    var stack = deck.querySelector('.stack');
    var box = stack || deck;
    // кладемо картку точно на місце стосу
    if (stack) {
      el.style.left = stack.offsetLeft + 'px';
      el.style.top = stack.offsetTop + 'px';
      el.style.width = stack.offsetWidth + 'px';
      el.style.height = stack.offsetHeight + 'px';
    }
    deck.appendChild(el);
    if (box !== deck) box.style.visibility = 'hidden';
  }

  function unlockDeck(deck) {
    var el = deck.querySelector(':scope > .demoLocked');
    if (!el) return;
    el.remove();
    var stack = deck.querySelector('.stack');
    if (stack) stack.style.visibility = '';
    hideTip();
  }

  function scan() {
    var decks = document.querySelectorAll('.deck');
    for (var i = 0; i < decks.length; i++) {
      var d = decks[i], kind = deckKind(d), n = deckCount(d);
      if (!kind || n === null) continue;
      if (n === 0) lockDeck(d, kind); else unlockDeck(d);
    }
  }

  var queued = false;
  function queueScan() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; scan(); });
  }

  function start() {
    addPill();
    scan();
    new MutationObserver(queueScan).observe(document.body, { subtree: true, childList: true, characterData: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
